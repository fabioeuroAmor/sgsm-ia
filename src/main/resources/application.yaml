# --- USAR OLLAMA LOCAL (TOTALMENTE GRATUITO - SEM INTERNET) ---
# USANDO langchain4j ollama ao mesmo tempo e de graça
langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: deepseek-r1:8b  # Baixe com: ollama run deepseek-r1:8b
      temperature: 0.7
      max-tokens: 300
      timeout: 300000
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: http://localhost:11434
      model-name: nomic-embed-text  # Baixe com: ollama pull nomic-embed-text
      timeout: 60000

ia:
  provider: ${IA_PROVIDER:openai}
  top-k: 10
  redis:
    stream-key: sgsm:events:vetorizacao
    group: sgsm-ia-group
    consumer: sgsm-ia-consumer-1

crm:
  analitico:
    sync-interval-ms: 1800000  # 30 minutos

logging:
  level:
    br.com.sgsm.ia.service.AssistenteMedicoService: DEBUG
