spring:
  application:
    name: sgsm-ia
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8082}

milvus:
  collection: sgsm_documentos
  embedding-dimension: ${MILVUS_EMBEDDING_DIM:768}

ia:
  top-k: 10
  redis:
    stream-key: sgsm:events:vetorizacao
    group: sgsm-ia-group
    consumer: sgsm-ia-consumer-1

crm:
  analitico:
    sync-interval-ms: 1800000
