spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified
    username: postgres
    password: postgres
    hikari:
      connectionTimeout: 20000
      maximumPoolSize: 5
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
    ddl-auto: none
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

milvus:
  host: localhost
  port: 19530

jwt:
  secret: sgsm-chave-desenvolvimento-local-minimo-256-bits-nao-usar-em-producao

ia:
  provider: ollama
  crypto:
    # Chave de desenvolvimento local — NAO usar em producao. Em hom/prd vem de variável de ambiente.
    nota-clinica-key: darxrcnm1j5yKMNibgwR9915HT35fzjyaZMP8rBGKt0=

langchain4j:
  ollama:
    chat-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_CHAT_MODEL:deepseek-r1:8b}
      temperature: 0.3
      max-tokens: 400
      timeout: 300000
      log-requests: false
      log-responses: false
    embedding-model:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: 60000

logging:
  level:
    br.com.sgsm.ia: DEBUG
    br.com.sgsm.ia.service.AssistenteMedicoService: DEBUG
