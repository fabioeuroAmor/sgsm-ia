spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 20
      minimumIdle: 5
      idleTimeout: 600000
      maxLifetime: 1800000
      connectionTestQuery: SELECT 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: sgsm
    ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

milvus:
  host: ${MILVUS_HOST}
  port: ${MILVUS_PORT:19530}

jwt:
  secret: ${JWT_SECRET}

ia:
  provider: openai
  crypto:
    nota-clinica-key: ${NOTA_CLINICA_CRYPTO_KEY}

# OpenAI para producao - custo controlado, qualidade superior
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      model-name: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      temperature: 0.3
      max-tokens: 500
      timeout: 60000
      log-requests: false
      log-responses: false
    embedding-model:
      api-key: ${OPENAI_API_KEY}
      model-name: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout: 30000

logging:
  level:
    root: WARN
    br.com.sgsm.ia: INFO
